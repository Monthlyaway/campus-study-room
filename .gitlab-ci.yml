workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [release-test]

variables:
  STUDYROOM_CI_REGISTRY: m.daocloud.io/docker.io/library
  MAVEN_CONFIG: ""
  MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'

container-release:
  stage: release-test
  tags: [amd64-build]
  image: $STUDYROOM_CI_REGISTRY/docker:28.5.2-cli@sha256:625d9431a9f54c5a2bc90f24f0e1c3d55b1349fd857dd85035f98c2c9acbdd4d
  services:
    - name: $STUDYROOM_CI_REGISTRY/docker:28.5.2-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
      alias: docker
      command: ["--registry-mirror=https://docker.m.daocloud.io"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: $CI_BUILDS_DIR/.studyroom-dind-$CI_JOB_ID
    DOCKER_CERT_PATH: $CI_BUILDS_DIR/.studyroom-dind-$CI_JOB_ID/client
    DOCKER_TLS_VERIFY: '1'
  resource_group: studyroom-container-test
  interruptible: false
  environment:
    name: test/container-$CI_PIPELINE_IID
    action: start
    auto_stop_in: 1 day
  before_script:
    - apk add --no-cache python3 git
  script:
    - python3 scripts/ci-release.py
  artifacts:
    when: always
    paths: [output/container-release/, output/browser/]
    reports:
      junit: output/browser/junit.xml
    expire_in: 90 days

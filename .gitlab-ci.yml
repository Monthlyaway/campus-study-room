workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [verify, integration, package]

default:
  tags: [amd64]
  interruptible: true

variables:
  STUDYROOM_CI_REGISTRY: m.daocloud.io/docker.io/library
  MAVEN_CONFIG: ""
  MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'

backend:
  stage: verify
  image: $STUDYROOM_CI_REGISTRY/maven:3.9.11-eclipse-temurin-21@sha256:6fdc855a6ed81d288ca7ca37ac6ff5e9308b612485c0801d70b25a858c83d237
  cache:
    key: maven-java21-boot411
    paths: [.m2/repository/]
  script:
    - ./mvnw -B -ntp verify
  artifacts:
    when: always
    reports:
      junit: '**/target/surefire-reports/TEST-*.xml'
    paths:
      - services/core-service/target/*.jar
      - services/repair-service/target/*.jar
      - tools/migration-runner/target/*.jar
    expire_in: 14 days

frontend:
  stage: verify
  image: $STUDYROOM_CI_REGISTRY/node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
  cache:
    key:
      files: [apps/web/pnpm-lock.yaml]
    paths: [apps/web/.pnpm-store/]
  before_script:
    - for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do if [ -f "$sources" ]; then sed -i "s|http://|https://|g" "$sources"; fi; done
    # The slim image has no OS trust store. Bootstrap HTTPS using Node's bundled roots.
    - node -e "require('fs').writeFileSync('/tmp/studyroom-ci-ca.pem', require('tls').rootCertificates.join('\\n'))"
    - apt-get -o Acquire::https::CaInfo=/tmp/studyroom-ci-ca.pem -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update -qq
    - apt-get -o Acquire::https::CaInfo=/tmp/studyroom-ci-ca.pem -o Acquire::Retries=3 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends git ca-certificates
    - rm /tmp/studyroom-ci-ca.pem
    - corepack enable
    - corepack prepare pnpm@10.34.7 --activate
    - cd apps/web
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm generate
    - git diff --exit-code -- src/services/generated
    - pnpm typecheck
    - pnpm test
    - pnpm build
  artifacts:
    paths: [apps/web/dist/]
    expire_in: 14 days

integration:
  stage: integration
  image: $STUDYROOM_CI_REGISTRY/maven:3.9.11-eclipse-temurin-21@sha256:6fdc855a6ed81d288ca7ca37ac6ff5e9308b612485c0801d70b25a858c83d237
  needs: [backend, frontend]
  cache:
    key: maven-java21-boot411
    paths: [.m2/repository/]
  services:
    - name: $STUDYROOM_CI_REGISTRY/postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
      alias: postgres
  variables:
    POSTGRES_DB: studyroom
    POSTGRES_USER: studyroom_bootstrap
    POSTGRES_PASSWORD: isolated-ci-service-only
    PGHOST: postgres
    PGPORT: '5432'
  resource_group: studyroom-test
  interruptible: false
  environment:
    name: test/ci-$CI_PIPELINE_ID
    action: start
    auto_stop_in: 1 day
  before_script:
    - for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do if [ -f "$sources" ]; then sed -i "s|http://|https://|g" "$sources"; fi; done
    - apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update -qq && apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends python3 postgresql-client
  script:
    - python3 -m unittest discover -s tests/ops -v
    - python3 scripts/ci-integration.py
  artifacts:
    when: always
    paths: [output/ci/]
    reports:
      junit: 'output/ci/*.xml'
    expire_in: 14 days

package:
  stage: package
  image: $STUDYROOM_CI_REGISTRY/node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
  needs: [backend, frontend, integration]
  before_script:
    - for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do if [ -f "$sources" ]; then sed -i "s|http://|https://|g" "$sources"; fi; done
    # The slim image has no OS trust store. Bootstrap HTTPS using Node's bundled roots.
    - node -e "require('fs').writeFileSync('/tmp/studyroom-ci-ca.pem', require('tls').rootCertificates.join('\\n'))"
    - apt-get -o Acquire::https::CaInfo=/tmp/studyroom-ci-ca.pem -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update -qq
    - apt-get -o Acquire::https::CaInfo=/tmp/studyroom-ci-ca.pem -o Acquire::Retries=3 -o Acquire::https::Timeout=30 install -y -qq --no-install-recommends git ca-certificates
    - rm /tmp/studyroom-ci-ca.pem
  script:
    - mkdir -p output/release
    - git archive --format=tar.gz -o output/release/studyroom-source-$CI_COMMIT_SHORT_SHA.tar.gz "$CI_COMMIT_SHA"
    - sha256sum output/release/*.tar.gz > output/release/SHA256SUMS
    - printf '{"commit":"%s","pipeline":"%s","tag":"%s"}\n' "$CI_COMMIT_SHA" "$CI_PIPELINE_URL" "${CI_COMMIT_TAG:-}" > output/release/build.json
  artifacts:
    name: studyroom-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    paths: [output/release/]
    expire_in: 90 days

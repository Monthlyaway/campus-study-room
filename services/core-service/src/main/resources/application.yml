server:
  port: ${SERVER_PORT:${PORT:8081}}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: STUDYROOMSESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
spring:
  main:
    banner-mode: "off"
  application:
    name: core-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studyroom}
    username: ${DB_USERNAME:studyroom_core}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
        jdbc:
          time_zone: UTC
  session:
    jdbc:
      initialize-schema: never
      table-name: session.SPRING_SESSION
  flyway:
    enabled: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
studyroom:
  env: ${ENV_NAME:local}
  internal-user: ${INTERNAL_USERNAME:repair-service}
  internal-password: ${INTERNAL_PASSWORD:}
  checkin-key: ${CHECKIN_CODE_ENCRYPTION_KEY:}
  smtp-from: ${SMTP_FROM:noreply@example.invalid}
  mail-mode: ${MAIL_MODE:capture}
  mail-directory: ${MAIL_DIRECTORY:./output/mail}
  release-id: ${RELEASE_ID:development}
  commit: ${GIT_COMMIT:working-tree}

logging:
  structured:
    format:
      console: com.campus.studyroom.security.StudyroomLogFormatter
      file: com.campus.studyroom.security.StudyroomLogFormatter

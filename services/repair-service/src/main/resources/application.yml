server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
spring:
  application:
    name: repair-service
  datasource:
    url: ${REPAIR_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/studyroom}}
    username: ${REPAIR_DB_USER:${DB_USERNAME:studyroom_repair}}
    password: ${REPAIR_DB_PASSWORD:${DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: repair
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: session.SPRING_SESSION
  jackson:
    deserialization:
      accept-float-as-int: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
studyroom:
  core-url: ${CORE_INTERNAL_URL:http://localhost:8081}
  internal-username: ${INTERNAL_USERNAME:repair-service}
  internal-password: ${INTERNAL_PASSWORD:}
  internal-password-file: ${INTERNAL_PASSWORD_FILE:}
  cookie-secure: ${COOKIE_SECURE:false}
  control-dir: ${CONTROL_DIR:/app/control}
  jobs-paused: ${JOBS_PAUSED:false}
  release-id: ${RELEASE_ID:local}
  commit: ${GIT_COMMIT:development}

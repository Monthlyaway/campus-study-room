name: Read-only package diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  inspect:
    if: github.repository == 'Monthlyaway/campus-study-room' && github.actor == 'Monthlyaway' && github.triggering_actor == 'Monthlyaway'
    runs-on: [self-hosted, Linux, X64, campus-study-room]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read package association
        shell: bash
        run: |
          gh api users/Monthlyaway/packages/container/campus-study-room-core --jq '{keys:keys,name,visibility,repository:{id:.repository.id,name:.repository.name,full_name:.repository.full_name,owner:.repository.owner.login}}'
          gh api repos/Monthlyaway/campus-study-room --jq '{id,full_name,private}'

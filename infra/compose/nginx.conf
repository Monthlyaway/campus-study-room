server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz { access_log off; return 200 'ok'; }
  location = /version { alias /usr/share/nginx/html/version.json; default_type application/json; add_header Cache-Control no-store; }
  location ^~ /internal { return 404; }
  location ^~ /actuator { return 404; }

  location /api/v1/repairs {
    if (-f /app/control/maintenance) { return 503; }
    proxy_pass http://repair:8080;
    include /etc/nginx/proxy_params.studyroom;
  }
  location /api/ {
    if (-f /app/control/maintenance) { return 503; }
    proxy_pass http://core:8080;
    include /etc/nginx/proxy_params.studyroom;
  }
  location / {
    if (-f /app/control/maintenance) { return 503; }
    try_files $uri $uri/ /index.html;
  }
  error_page 503 /maintenance.html;
  location = /maintenance.html { internal; }
}

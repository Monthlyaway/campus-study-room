# Disposable check dependencies: a unique project and volume per invocation.
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    environment:
      POSTGRES_DB: studyroom
      POSTGRES_USER: studyroom_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1::5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U studyroom_bootstrap -d studyroom"]
      interval: 2s
      timeout: 3s
      retries: 40
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports: ["127.0.0.1::1025", "127.0.0.1::8025"]
    environment:
      MP_MAX_MESSAGES: 10000
      MP_SMTP_AUTH_ACCEPT_ANY: 0
secrets:
  postgres_password:
    file: ${CHECK_STATE_DIR:?}/postgres_password
volumes:
  postgres-data:

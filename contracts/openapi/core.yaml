            "type": "string",
            "format": "uuid"
          }
        }
      },
      "VersionCommand": {
        "type": "object",
        "required": [
          "expectedVersion"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      },
      "ReservationCreate": {
        "type": "object",
        "required": [
          "seatId",
          "startAt",
          "endAt"
        ],
        "properties": {

            "format": "date-time"
          },
          "endAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "ApplicationCreate": {
        "type": "object",
        "required": [
          "roomId",
          "startAt",
          "endAt",
          "purposeTitle",
          "purposeDescription"
        ],
        "properties": {
          "roomId": {
            "type": "string",
            "format": "uuid"
          },
          "startAt": {
            "type": "string",
            "format": "date-time"
          },
          "endAt": {
            "type": "string",
            "format": "date-time"
          },
          "purposeTitle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "purposeDescription": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          }
        }
      },
      "Login": {
        "type": "object",
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string"
          },
          "password": {
            "type": "string",
            "format": "password"
          }
        }
      },
      "Reservation": {
        "type": "object",
        "required": [
          "id",
          "version",
          "status",
          "startAt",
          "endAt",
          "allowedActions"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer"
          },
          "status": {
            "type": "string",
            "enum": [
              "RESERVED",
              "CHECKED_IN",
              "CANCELLED",
              "NO_SHOW",
              "COMPLETED",
              "INTERRUPTED"
            ]
          },
          "startAt": {
            "type": "string",
            "format": "date-time"
          },
          "endAt": {
            "type": "string",
            "format": "date-time"
          },
          "seatId": {
            "type": "string",
            "format": "uuid"
          },
          "roomId": {
            "type": "string",
            "format": "uuid"
          },
          "roomName": {
            "type": "string"
          },
          "seatCode": {
            "type": "string"
          },
          "allowedActions": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "cancel",
                "check-in"
              ]
            }
          }
        }
      },
      "Application": {
        "type": "object",
        "required": [
          "id",
          "version",
          "status",
          "allowedActions"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer"
          },
          "status": {
            "type": "string",
            "enum": [
              "PENDING",
              "APPROVED",
              "REJECTED",
              "CANCELLED",
              "EXPIRED",
              "COMPLETED"
            ]
          },
          "currentStep": {
            "type": "integer",
            "enum": [
              1,
              2
            ]
          },
          "steps": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": true
            }
          },
          "actions": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": true
            }

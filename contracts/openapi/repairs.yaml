            "type": "integer"
          },
          "actorId": {
            "type": "string",
            "format": "uuid"
          },
          "decision": {
            "type": "string",
            "enum": [
              "ACCEPT",
              "REJECT"
            ]
          },
          "comment": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 500

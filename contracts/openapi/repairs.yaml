            "type": "boolean"
          },
          "attempts": {
            "type": "integer",
            "minimum": 0
          },
          "lastErrorCode": {
            "type": [
              "string",
              "null"
            ]
          },
          "lastAttemptAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "nextAttemptAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "needsAttention": {
            "type": "boolean"
          }
        }
      },
      "RepairWorker": {
        "type": "object",
        "required": [
          "userId",
          "displayName"

            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "reason": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 2000
          },
          "oldAssignee": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "newAssignee": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },

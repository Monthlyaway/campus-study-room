        "type": "object",
        "required": [
          "id",
          "reporterId",
          "roomId",
          "title",
          "description",
          "status",
          "version",
          "allowedActions",
          "submittedAt",
          "assignDueAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "reporterId": {
            "type": "string",
            "format": "uuid"
          },
          "roomId": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string",
            "maxLength": 100
          },
          "description": {
            "type": "string",
            "maxLength": 2000
          },
          "status": {
            "$ref": "#/components/schemas/RepairStatus"
          },
          "assignedTo": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "assignedBy": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "acceptanceRound": {
            "type": "integer"
          },
          "lastWorkNote": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 2000
          },
          "resourceVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "allowedActions": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "assign",

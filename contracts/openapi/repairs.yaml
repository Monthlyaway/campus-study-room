  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "STUDYROOMSESSION"
      }
    },
    "schemas": {
      "RepairStatus": {
        "type": "string",
        "enum": [
          "SUBMITTED",
          "ASSIGNED",
          "BLOCK_PENDING",
          "IN_REPAIR",
          "AWAITING_ACCEPTANCE",
          "RELEASE_PENDING",
          "CLOSED",
          "CANCELLED"
        ]
      },
      "RepairCreate": {
        "type": "object",
        "required": [
          "roomId",
          "title",
          "description"
        ],
        "properties": {
          "roomId": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "description": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          }
        }
      },
      "RepairExpectedVersion": {
        "type": "object",
        "required": [
          "expectedVersion"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      },
      "RepairAssign": {
        "type": "object",
        "required": [
          "expectedVersion",
          "assignedTo"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "assignedTo": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "RepairComplete": {
        "type": "object",
        "required": [
          "expectedVersion",
          "workNote"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "workNote": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          }
        }
      },
      "RepairAcceptanceRequest": {
        "type": "object",
        "required": [
          "expectedVersion",
          "decision"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "decision": {
            "type": "string",
            "enum": [
              "ACCEPT",
              "REJECT"
            ]
          },
          "comment": {
            "type": "string",
            "maxLength": 500
          }
        }
      },
      "RepairCancel": {
        "type": "object",
        "required": [
          "expectedVersion"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "reason": {
            "type": "string",
            "maxLength": 500
          }
        }
      },
      "RepairRatingRequest": {
        "type": "object",
        "required": [
          "expectedVersion",
          "score"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "score": {
            "type": "integer",
            "minimum": 1,
            "maximum": 5
          },
          "comment": {
            "type": "string",
            "maxLength": 500
          }
        }
      },
      "RepairRating": {
        "type": "object",
        "required": [
          "score",
          "createdAt"
        ],
        "properties": {
          "score": {
            "type": "integer",
            "minimum": 1,
            "maximum": 5
          },
          "comment": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 500
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },

          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "SUBMITTED",
                "ASSIGNED",
                "BLOCK_PENDING",
                "IN_REPAIR",
                "AWAITING_ACCEPTANCE",
                "RELEASE_PENDING",
                "CLOSED",
                "CANCELLED"
              ]
            }
          },
          {
            "name": "roomId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "uuid"

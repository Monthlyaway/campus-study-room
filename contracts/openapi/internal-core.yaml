          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/NotificationCommand"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "X-Request-ID",
            "in": "header",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "Propagate the originating business request ID."
          }
        ]
      }
    },
    "/internal/v1/repair-workers": {
      "get": {
        "operationId": "get_internal_v1_repair_workers",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RepairWorkerPageEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "405": {
            "$ref": "#/components/responses/Error405"
          },
          "406": {
            "$ref": "#/components/responses/Error406"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "415": {
            "$ref": "#/components/responses/Error415"
          },
          "422": {
            "$ref": "#/components/responses/Error422"
          },
          "429": {
            "$ref": "#/components/responses/Error429"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        },
        "parameters": [
          {
            "name": "X-Request-ID",
            "in": "header",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "Propagate the originating business request ID."
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "name": "size",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "actorId",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "authVersion",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64",
              "minimum": 0
            }
          },
          {
            "name": "roomId",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    }
  },
  "components": {
    "securitySchemes": {
      "serviceBasic": {
        "type": "http",
        "scheme": "basic"
      }
    },
    "schemas": {
      "AuthorizationCheck": {
        "type": "object",
        "properties": {
          "userId": {
            "type": "string",
            "format": "uuid"
          },
          "authVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "permission": {
            "type": "string"
          },
          "roomId": {
            "type": "string",
            "format": "uuid",
            "nullable": true
          },
          "ownerId": {
            "type": "string",
            "format": "uuid",
            "nullable": true
          },
          "assignedTo": {
            "type": "string",
            "format": "uuid",
            "nullable": true
          }
        },
        "required": [
          "userId",
          "authVersion",
          "permission"
        ],
        "additionalProperties": false
      },
      "AuthorizationResult": {
        "type": "object",
        "properties": {
          "allowed": {
            "type": "boolean"
          },
          "reason": {
            "type": "string",
            "enum": [
              "ALLOWED",
              "FORBIDDEN",
              "INVALID_SESSION"
            ]
          }
        },
        "required": [
          "allowed",
          "reason"
        ],
        "additionalProperties": false
      },
      "RoomReference": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "enabled": {
            "type": "boolean"
          },
          "departmentId": {
            "type": "string",
            "format": "uuid",
            "nullable": true
          }
        },
        "required": [
          "id",
          "name",
          "enabled",
          "departmentId"
        ],
        "additionalProperties": false
      },
      "ResourceCommand": {
        "type": "object",
        "properties": {
          "commandId": {
            "type": "string",
            "format": "uuid"
          },
          "sourceType": {
            "type": "string",
            "enum": [
              "M3"
            ]
          },
          "sourceId": {
            "type": "string",
            "format": "uuid"
          },
          "sourceVersion": {
            "type": "integer",
            "enum": [
              1,
              2
            ]
          },
          "roomId": {
            "type": "string",
            "format": "uuid"
          },
          "actorId": {
            "type": "string",
            "format": "uuid"
          },
          "operation": {
            "type": "string",
            "enum": [
              "BLOCK",
              "RELEASE"
            ]
          },
          "occurredAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "commandId",
          "sourceType",
          "sourceId",
          "sourceVersion",
          "roomId",
          "actorId",
          "operation",
          "occurredAt"
        ],
        "additionalProperties": false,
        "description": "BLOCK uses sourceVersion=1; RELEASE uses 2. Complete command payload and UUID must be unchanged across retries. Same command with different payload returns 409."
      },
      "ResourceResult": {
        "type": "object",
        "properties": {
          "result": {
            "type": "string",
            "enum": [
              "APPLIED",
              "ALREADY_APPLIED",
              "STALE_IGNORED"
            ]
          },
          "sourceVersion": {
            "type": "integer",
            "enum": [
              1,
              2
            ]
          },
          "sourceState": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "RELEASED"
            ]
          },
          "claimId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "result",
          "sourceVersion",
          "sourceState"
        ],
        "additionalProperties": false
      },
      "NotificationCommand": {
        "type": "object",
        "properties": {
          "commandId": {
            "type": "string",
            "format": "uuid"
          },
          "roomId": {
            "type": "string",
            "format": "uuid"
          },
          "orderId": {
            "type": "string",
            "format": "uuid"
          },
          "reporterId": {
            "type": "string",
            "format": "uuid"
          },
          "assignedTo": {
            "type": "string",
            "format": "uuid",
            "nullable": true
          },
          "eventType": {
            "type": "string",
            "enum": [
              "ASSIGNED",
              "AWAITING_ACCEPTANCE",
              "ASSIGN_OVERDUE",
              "WORK_OVERDUE",
              "ACCEPT_OVERDUE",
              "CLOSED",
              "CANCELLED"
            ]
          },
          "eventCycle": {
            "type": "string"
          },
          "acceptanceRound": {
            "type": "integer",
            "minimum": 0
          },
          "payload": {
            "type": "object",
            "properties": {
              "orderId": {
                "type": "string",
                "format": "uuid"
              },
              "title": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "dueAt": {
                "type": "string",
                "format": "date-time",
                "nullable": true
              },
              "assignDueAt": {
                "type": "string",
                "format": "date-time",
                "nullable": true
              },
              "workDueAt": {
                "type": "string",
                "format": "date-time",
                "nullable": true
              },
              "acceptDueAt": {
                "type": "string",
                "format": "date-time",
                "nullable": true
              }
            },
            "required": []
          }
        },
        "required": [
          "commandId",
          "roomId",
          "orderId",
          "reporterId",
          "eventType"
        ],
        "additionalProperties": false
      },
      "NotificationResult": {
        "type": "object",
        "properties": {
          "result": {
            "type": "string",
            "enum": [
              "APPLIED"
            ]
          },
          "recipientCount": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "result",
          "recipientCount"
        ],
        "additionalProperties": false
      },
      "RepairWorker": {
        "type": "object",
        "properties": {
          "userId": {
            "type": "string",
            "format": "uuid"
          },
          "displayName": {
            "type": "string"
          }
        },
        "required": [
          "userId",
          "displayName"
        ],
        "additionalProperties": false
      },
      "RepairWorkerPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RepairWorker"
            }
          },
          "page": {
            "type": "integer",
            "minimum": 1
          },
          "size": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "total": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "items",
          "page",
          "size",
          "total"
        ],
        "additionalProperties": false
      },
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "details": {
                "type": "object",
                "additionalProperties": true
              }
            },
            "required": [
              "code",
              "message"
            ],
            "additionalProperties": false
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "error",
          "requestId"
        ],
        "additionalProperties": false
      },
      "AuthorizationResultEnvelope": {
        "type": "object",
        "properties": {
          "data": {
            "$ref": "#/components/schemas/AuthorizationResult"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "data",
          "requestId"
        ],
        "additionalProperties": false
      },
      "RoomReferenceEnvelope": {
        "type": "object",
        "properties": {
          "data": {
            "$ref": "#/components/schemas/RoomReference"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "data",
          "requestId"
        ],
        "additionalProperties": false
      },
      "ResourceResultEnvelope": {
        "type": "object",
        "properties": {
          "data": {
            "$ref": "#/components/schemas/ResourceResult"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "data",
          "requestId"
        ],
        "additionalProperties": false
      },
      "NotificationResultEnvelope": {
        "type": "object",
        "properties": {
          "data": {
            "$ref": "#/components/schemas/NotificationResult"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "data",
          "requestId"
        ],
        "additionalProperties": false
      },
      "RepairWorkerPageEnvelope": {
        "type": "object",
        "properties": {
          "data": {
            "$ref": "#/components/schemas/RepairWorkerPage"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "data",
          "requestId"
        ],
        "additionalProperties": false
      }
    },
    "responses": {
      "Error400": {
        "description": "Invalid parameter or JSON format",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error401": {
        "description": "Authentication required or session invalid",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error403": {
        "description": "Permission denied",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error404": {
        "description": "Not found or not visible",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error405": {
        "description": "Method not allowed",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error406": {
        "description": "Representation not acceptable",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error409": {
        "description": "Resource, state, version or idempotency conflict",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error415": {
        "description": "Unsupported media type",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error422": {
        "description": "Business validation failed",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error429": {
        "description": "Rate limited",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "headers": {
          "Retry-After": {
            "description": "Seconds before retrying",
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          }
        }
      },
      "Error500": {
        "description": "Unexpected failure; report requestId",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error503": {
        "description": "Dependency unavailable",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    }
  }
}

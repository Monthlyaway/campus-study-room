{
  "openapi": "3.0.3",
  "info": {
    "title": "Studyroom Core Internal API",
    "version": "0.1.0",
    "description": "Private service network only; HTTP Basic machine authentication, no browser session or CSRF. Denied or invalid user authorization is a typed 200 decision; malformed requests and command conflicts are HTTP errors."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "security": [
    {
      "serviceBasic": []
    }
  ],
  "paths": {
    "/internal/v1/authorization/check": {
      "post": {
        "operationId": "post_internal_v1_authorization_check",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthorizationResultEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "405": {
            "$ref": "#/components/responses/Error405"
          },
          "406": {
            "$ref": "#/components/responses/Error406"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "415": {
            "$ref": "#/components/responses/Error415"
          },
          "422": {
            "$ref": "#/components/responses/Error422"
          },
          "429": {
            "$ref": "#/components/responses/Error429"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AuthorizationCheck"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "X-Request-ID",
            "in": "header",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "Propagate the originating business request ID."
          }
        ]
      }
    },
    "/internal/v1/rooms/{id}/reference": {
      "get": {
        "operationId": "get_internal_v1_rooms_id_reference",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RoomReferenceEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "405": {
            "$ref": "#/components/responses/Error405"
          },
          "406": {
            "$ref": "#/components/responses/Error406"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "415": {
            "$ref": "#/components/responses/Error415"
          },
          "422": {
            "$ref": "#/components/responses/Error422"
          },
          "429": {
            "$ref": "#/components/responses/Error429"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        },
        "parameters": [
          {
            "name": "X-Request-ID",
            "in": "header",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "Propagate the originating business request ID."
          },
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    },
    "/internal/v1/resource-commands": {
      "post": {
        "operationId": "post_internal_v1_resource_commands",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ResourceResultEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "405": {
            "$ref": "#/components/responses/Error405"
          },
          "406": {
            "$ref": "#/components/responses/Error406"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "415": {
            "$ref": "#/components/responses/Error415"
          },
          "422": {
            "$ref": "#/components/responses/Error422"
          },
          "429": {
            "$ref": "#/components/responses/Error429"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ResourceCommand"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "X-Request-ID",
            "in": "header",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "Propagate the originating business request ID."
          }
        ]
      }
    },
    "/internal/v1/notifications": {
      "post": {
        "operationId": "post_internal_v1_notifications",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NotificationResultEnvelope"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "405": {
            "$ref": "#/components/responses/Error405"
          },
          "406": {
            "$ref": "#/components/responses/Error406"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "415": {
            "$ref": "#/components/responses/Error415"
          },
          "422": {
            "$ref": "#/components/responses/Error422"
          },
          "429": {
            "$ref": "#/components/responses/Error429"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          },
          "503": {
